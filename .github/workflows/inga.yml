name: Inga Analysis

on:
  pull_request:

jobs:
  inga-analysis:

    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Compile with Gradle
      run: ./gradlew compileJava
    - uses: seachicken/inga-action@inga-saas
      with:
        language: "java"
        exclude: "src/test/**"
        inga-host: ${{ secrets.INGA_HOST }}
